[project]
name = "voice-inbox"
version = "0.1.0"
description = "Local Ukrainian voice-note inbox: voice notes -> tasks, events, notes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "gradio",
    "pydantic>=2",
    "httpx",
    "parakeet-mlx",
    "dateparser",
    "sentence-transformers",
    "icalendar",
    "jiwer",
    "sounddevice",
    "soundfile",
    "numpy",
]

[project.scripts]
inbox-server = "inbox.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inbox"]
